plugins {
    id "com.android.application"
}

def localSigningProperties = new Properties()
def localSigningFile = rootProject.file("signing/release.properties")
if (localSigningFile.isFile()) {
    localSigningFile.withInputStream { stream ->
        localSigningProperties.load(stream)
    }
}

def signingValue = { name ->
    def environmentValue = System.getenv(name)
    environmentValue != null ? environmentValue : localSigningProperties.getProperty(name)
}

def releaseStoreFile = signingValue("ANDROID_SCREEN_TIMER_KEYSTORE_FILE")
def releaseStorePassword = signingValue("ANDROID_SCREEN_TIMER_KEYSTORE_PASSWORD")
def releaseKeyAlias = signingValue("ANDROID_SCREEN_TIMER_KEY_ALIAS")
def releaseKeyPassword = signingValue("ANDROID_SCREEN_TIMER_KEY_PASSWORD")
def hasReleaseSigning = [
        releaseStoreFile,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { value -> value != null && !value.isBlank() }

android {
    namespace "dev.tvtimer.controller"
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "dev.tvtimer.controller"
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName "1.4.7"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
    }

    sourceSets {
        debug.assets.srcDir(layout.buildDirectory.dir("generated/embedded-apk/debug"))
        release.assets.srcDir(layout.buildDirectory.dir("generated/embedded-apk/release"))
    }
}

tasks.register("prepareEmbeddedDebugApk", Copy) {
    dependsOn(":app:assembleDebug")
    from(project(":app").layout.buildDirectory.file("outputs/apk/debug/app-debug.apk"))
    into(layout.buildDirectory.dir("generated/embedded-apk/debug"))
    rename { "android-screen-timer.apk" }
}

tasks.register("prepareEmbeddedReleaseApk", Copy) {
    dependsOn(":app:assembleRelease")
    from(project(":app").layout.buildDirectory.file("outputs/apk/release/app-release.apk"))
    into(layout.buildDirectory.dir("generated/embedded-apk/release"))
    rename { "android-screen-timer.apk" }
}

tasks.matching { it.name == "mergeDebugAssets" }.configureEach {
    dependsOn("prepareEmbeddedDebugApk")
}

tasks.matching { it.name == "mergeReleaseAssets" }.configureEach {
    dependsOn("prepareEmbeddedReleaseApk")
}

tasks.matching { it.name.toLowerCase().contains("lint") && it.name.contains("Debug") }.configureEach {
    dependsOn("prepareEmbeddedDebugApk")
}

tasks.matching { it.name.toLowerCase().contains("lint") && it.name.contains("Release") }.configureEach {
    dependsOn("prepareEmbeddedReleaseApk")
}

dependencies {
    implementation "com.github.MuntashirAkon:libadb-android:3.1.1"
    implementation "com.github.MuntashirAkon:sun-security-android:1.1"
    implementation "org.conscrypt:conscrypt-android:2.5.3"
    testImplementation "junit:junit:4.13.2"
}

tasks.configureEach { task ->
    if (task.name == "assembleRelease" && !hasReleaseSigning) {
        task.doFirst {
            throw new GradleException(
                    "Release signing is not configured. Create signing/release.properties or set the ANDROID_SCREEN_TIMER_KEYSTORE_* environment variables."
            )
        }
    }
}
